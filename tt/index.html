<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gucci Exclusive</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
}

/* MOBILE CARD */
.container {
    max-width: 360px;
    margin: 20px auto;
    background: #111;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    color: white;
}

/* HEADER */
.header {
    background: #000;
    text-align: center;
    padding: 25px 15px;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 22px;
    letter-spacing: 3px;
    color: gold;
    margin-bottom: 10px;
}

.header h2 {
    margin: 5px 0;
}

.header p {
    font-size: 14px;
    color: #ccc;
}

/* CONTENT */
.content {
    padding: 20px;
}

.content h3 {
    margin-bottom: 15px;
}

/* STEPS */
.step {
    display: flex;
    margin-bottom: 15px;
}

.number {
    background: gold;
    color: black;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    text-align: center;
    line-height: 26px;
    margin-right: 10px;
    font-weight: bold;
}

/* BUTTON */
.btn {
    background: gold;
    color: black;
    padding: 15px;
    text-align: center;
    border-radius: 30px;
    margin-top: 20px;
    text-decoration: none;
    display: block;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* FOOTER */
.dropdown {
    margin-top: 15px;
    border-top: 1px solid #222;
    padding-top: 10px;
    color: #aaa;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">GUCCI</div>
        <h2>EXCLUSIVE ACCESS</h2>
        <p>Complete the steps below to unlock your private offer</p>
    </div>

    <div class="content">

        <h3>Steps to Access:</h3>

        <div class="step"><div class="number">1</div>Click "Enter Now"</div>
        <div class="step"><div class="number">2</div>Enter your basic details</div>
        <div class="step"><div class="number">3</div>Complete required steps</div>
        <div class="step"><div class="number">4</div>Unlock your access</div>

        <!-- الرابط ديالك -->
        <a href="https://linkthem.net/aff_c?offer_id=4294&aff_id=178108" class="btn">
            ENTER NOW
        </a>

        <div class="dropdown">Disclaimer ▼</div>
        <div class="dropdown">Eligibility ▼</div>

    </div>

</div>

</body>
</html>
