<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHEIN Offer</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

/* CARD */
.container {
    max-width: 360px;
    margin: 20px auto;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* HEADER */
.header {
    background: #000;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.logo {
    font-size: 24px;
    letter-spacing: 2px;
    font-weight: bold;
}

.header p {
    font-size: 14px;
    margin-top: 5px;
    color: #ddd;
}

/* CONTENT */
.content {
    padding: 20px;
}

.content h3 {
    margin-bottom: 15px;
}

/* STEPS */
.step {
    display: flex;
    margin-bottom: 15px;
}

.number {
    background: #ff3366;
    color: white;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    text-align: center;
    line-height: 26px;
    margin-right: 10px;
    font-weight: bold;
}

/* BUTTON */
.btn {
    background: #ff3366;
    color: white;
    padding: 15px;
    text-align: center;
    border-radius: 30px;
    margin-top: 20px;
    text-decoration: none;
    display: block;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* FOOTER */
.dropdown {
    margin-top: 15px;
    border-top: 1px solid #eee;
    padding-top: 10px;
    color: #555;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">SHEIN</div>
        <p>Exclusive Offer For You</p>
    </div>

    <div class="content">

        <h3>Steps to Qualify:</h3>

        <div class="step"><div class="number">1</div>Click "Start Now"</div>
        <div class="step"><div class="number">2</div>Enter your basic details</div>
        <div class="step"><div class="number">3</div>Complete required steps</div>
        <div class="step"><div class="number">4</div>Unlock your reward</div>

        <!-- الرابط الجديد -->
        <a href="https://linkthem.net/aff_c?offer_id=2224&aff_id=178108" class="btn">
            START NOW
        </a>

        <div class="dropdown">Disclaimer ▼</div>
        <div class="dropdown">Eligibility ▼</div>

    </div>

</div>

</body>
</html>
