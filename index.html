<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Gift Card</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#f5f5f5,#e6e6e6);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD */
.container {
    background: white;
    width: 360px;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    animation: fadeIn 0.8s ease;
}

/* LOGO */
.logo {
    font-size: 30px;
    font-weight: bold;
}
.logo span {
    color: #ff9900;
}

/* MONEY */
.amount {
    font-size: 45px;
    color: #ff9900;
    margin: 20px 0 5px;
    font-weight: bold;
}

/* TIMER */
.timer {
    background: #fff3e6;
    color: #ff6600;
    padding: 12px;
    border-radius: 12px;
    margin: 15px 0;
    font-weight: bold;
}

/* STEPS */
.step {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    text-align: left;
}
.circle {
    background: #ff9900;
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    text-align: center;
    margin-right: 10px;
}

/* BUTTON */
.btn {
    background: linear-gradient(90deg,#ff9900,#ff6600);
    color: white;
    padding: 16px;
    border-radius: 30px;
    margin-top: 20px;
    display: block;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    transition: 0.3s;
}
.btn:hover {
    transform: scale(1.05);
}

/* NOTIFICATION */
.popup {
    position: fixed;
    top: 20px;
    background: white;
    padding: 10px 15px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    font-size: 14px;
    animation: slideDown 0.5s;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1;}
}

@keyframes slideDown {
    from {transform: translateY(-20px); opacity:0;}
    to {transform: translateY(0); opacity:1;}
}
</style>
</head>

<body>

<div class="popup" id="popup">🔥 John just claimed $750</div>

<div class="container">

    <div class="logo">amazon<span>.gift</span></div>

    <div class="amount">$750</div>
    <div>Amazon Gift Card</div>

    <div class="timer">⏳ Offer expires in <span id="countdown">15:00</span></div>

    <div class="step"><div class="circle">1</div> Click The Button</div>
    <div class="step"><div class="circle">2</div> Enter Your Info</div>
    <div class="step"><div class="circle">3</div> Complete Offers</div>
    <div class="step"><div class="circle">4</div> Claim Reward</div>

    <!-- الرابط ديالك -->
    <a href="https://giftclick.org/aff_c?offer_id=144&aff_id=178108" class="btn">
        CLAIM YOUR REWARD NOW
    </a>

</div>

<script>
// Countdown
let time = 900;
let countdown = document.getElementById("countdown");

setInterval(() => {
    let min = Math.floor(time / 60);
    let sec = time % 60;
    countdown.innerHTML = ${min}:${sec < 10 ? "0"+sec : sec};
    if(time > 0) time--;
}, 1000);

// Fake notifications
let names = ["John","Emma","Michael","Sarah","David","Anna"];
setInterval(()=>{
    let randomName = names[Math.floor(Math.random()*names.length)];
    document.getElementById("popup").innerHTML = "🔥 " + randomName + " just claimed $750";
},5000);
</script>

</body>
</html>
